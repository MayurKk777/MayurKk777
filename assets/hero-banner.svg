<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img">
  <title>Mayur Kiran Kumar S</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="40%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violet-grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#B8FF6B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#B8FF6B" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon-strong">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="b" in2="b" operator="arithmetic" k1="0" k2="1.5" k3="1.5" k4="0" result="bright"/>
      <feMerge><feMergeNode in="bright"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0V40H0" fill="none" stroke="#00E5FF" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#8B5CF6" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" rx="12" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="12" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="12" fill="url(#dots)"/>

  <!-- Animated ambient glows -->
  <ellipse cx="950" cy="200" rx="350" ry="250" fill="url(#glow1)">
    <animate attributeName="rx" values="350;400;350" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="300" cy="280" rx="280" ry="200" fill="url(#glow2)">
    <animate attributeName="rx" values="280;330;280" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="640" cy="100" rx="200" ry="150" fill="url(#glow3)">
    <animate attributeName="ry" values="150;180;150" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Animated neural network - large -->
  <g filter="url(#neon)">
    <!-- Connections with animated dash -->
    <line x1="820" y1="60" x2="920" y2="130" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.4">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="920" y1="130" x2="1040" y2="80" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.3">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="920" y1="130" x2="1060" y2="200" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.3">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1040" y1="80" x2="1160" y2="130" stroke="#8B5CF6" stroke-width="0.7" stroke-opacity="0.3">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="1060" y1="200" x2="1180" y2="160" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.25">
      <animate attributeName="stroke-opacity" values="0.25;0.55;0.25" dur="4.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1060" y1="200" x2="1100" y2="300" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.3">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3.8s" repeatCount="indefinite"/>
    </line>
    <line x1="1180" y1="160" x2="1230" y2="230" stroke="#00E5FF" stroke-width="0.6" stroke-opacity="0.2">
      <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="4.2s" repeatCount="indefinite"/>
    </line>
    <line x1="1160" y1="130" x2="1180" y2="160" stroke="#B8FF6B" stroke-width="0.6" stroke-opacity="0.2">
      <animate attributeName="stroke-opacity" values="0.2;0.45;0.2" dur="5.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1100" y1="300" x2="1200" y2="330" stroke="#00E5FF" stroke-width="0.6" stroke-opacity="0.2">
      <animate attributeName="stroke-opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="1230" y1="230" x2="1200" y2="330" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="820" y1="60" x2="870" y2="30" stroke="#B8FF6B" stroke-width="0.5" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.15;0.3;0.15" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="1040" y1="80" x2="1080" y2="35" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.15"/>
    <line x1="1100" y1="300" x2="1020" y2="360" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.1"/>
    <line x1="750" y1="180" x2="820" y2="60" stroke="#00E5FF" stroke-width="0.6" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="750" y1="180" x2="920" y2="130" stroke="#8B5CF6" stroke-width="0.6" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.15;0.3;0.15" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="750" y1="180" x2="780" y2="310" stroke="#B8FF6B" stroke-width="0.5" stroke-opacity="0.1">
      <animate attributeName="stroke-opacity" values="0.1;0.25;0.1" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="780" y1="310" x2="1100" y2="300" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.1">
      <animate attributeName="stroke-opacity" values="0.1;0.2;0.1" dur="7s" repeatCount="indefinite"/>
    </line>

    <!-- Animated nodes - pulsing -->
    <circle cx="820" cy="60" r="4" fill="#00E5FF" opacity="0.9">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="130" r="5" fill="#8B5CF6" opacity="1">
      <animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="80" r="3.5" fill="#00E5FF" opacity="0.8">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="200" r="4.5" fill="#B8FF6B" opacity="0.85">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="130" r="3" fill="#8B5CF6" opacity="0.7">
      <animate attributeName="r" values="3;5;3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="160" r="3.5" fill="#00E5FF" opacity="0.75">
      <animate attributeName="r" values="3.5;5;3.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1230" cy="230" r="3" fill="#8B5CF6" opacity="0.6">
      <animate attributeName="r" values="3;4.5;3" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="300" r="4" fill="#00E5FF" opacity="0.8">
      <animate attributeName="r" values="4;6;4" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="330" r="2.5" fill="#8B5CF6" opacity="0.5">
      <animate attributeName="r" values="2.5;4;2.5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="30" r="2.5" fill="#B8FF6B" opacity="0.5">
      <animate attributeName="r" values="2.5;4;2.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="35" r="2" fill="#00E5FF" opacity="0.4"/>
    <circle cx="1020" cy="360" r="2" fill="#8B5CF6" opacity="0.3"/>
    <circle cx="750" cy="180" r="4" fill="#00E5FF" opacity="0.7">
      <animate attributeName="r" values="4;6;4" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="310" r="3" fill="#B8FF6B" opacity="0.5">
      <animate attributeName="r" values="3;5;3" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated rotating geometric element -->
  <g transform="translate(1100, 200)" opacity="0.3">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="70" fill="none" stroke="#00E5FF" stroke-width="0.6" stroke-dasharray="4 8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#8B5CF6" stroke-width="0.5" stroke-dasharray="3 6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#B8FF6B" stroke-width="0.4" stroke-dasharray="2 5"/>
    </g>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#94A3B8" stroke-opacity="0.15" stroke-width="0.5"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#94A3B8" stroke-opacity="0.15" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#00E5FF" opacity="0.9">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Circuit traces - animated flow -->
  <g stroke-width="1" fill="none">
    <path d="M0 390 H100 L120 370 H200 L215 380 H320 L340 365 H420" stroke="#00E5FF" stroke-opacity="0.12">
      <animate attributeName="stroke-opacity" values="0.12;0.3;0.12" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1280 390 H1180 L1160 370 H1080 L1065 380 H960 L940 365 H860" stroke="#8B5CF6" stroke-opacity="0.1">
      <animate attributeName="stroke-opacity" values="0.1;0.25;0.1" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0 400 H60 L80 385 H140 L150 395 H220" stroke="#B8FF6B" stroke-opacity="0.08">
      <animate attributeName="stroke-opacity" values="0.08;0.2;0.08" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- Top traces -->
    <path d="M850 8 H950 L970 28 H1040 L1050 18 H1120" stroke="#8B5CF6" stroke-opacity="0.08" stroke-width="0.8">
      <animate attributeName="stroke-opacity" values="0.08;0.18;0.08" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M1140 8 H1200 L1210 22 H1260" stroke="#00E5FF" stroke-opacity="0.06" stroke-width="0.6"/>
  </g>

  <!-- Horizontal accent lines -->
  <rect x="80" y="345" width="550" height="1.5" fill="url(#cyan-grad)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="80" y="352" width="300" height="0.8" fill="url(#violet-grad)" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Status indicators -->
  <g font-family="monospace" font-size="10" letter-spacing="2">
    <circle cx="90" cy="395" r="3" fill="#B8FF6B" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="398" fill="#94A3B8" opacity="0.4">SYS:ACTIVE</text>
    <circle cx="220" cy="395" r="3" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="230" y="398" fill="#94A3B8" opacity="0.4">SEC:ARMED</text>
    <circle cx="350" cy="395" r="3" fill="#8B5CF6" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="360" y="398" fill="#94A3B8" opacity="0.4">AI:ONLINE</text>
  </g>

  <!-- Typography -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Overline with animated opacity -->
    <text x="80" y="100" fill="#00E5FF" font-size="11" font-weight="700" letter-spacing="8" opacity="0.6">
      SYSTEMS ENGINEER  //  EST. 2026
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- Name - large -->
    <text x="78" y="170" fill="#FFFFFF" font-size="52" font-weight="900" letter-spacing="3" filter="url(#soft)">MAYUR KIRAN</text>
    <text x="78" y="230" fill="#FFFFFF" font-size="52" font-weight="900" letter-spacing="3" filter="url(#soft)">KUMAR S</text>

    <!-- Role bar -->
    <text x="82" y="272" fill="#94A3B8" font-size="14" font-weight="600" letter-spacing="5">SOFTWARE ENGINEER</text>
    <text x="290" y="272" fill="#00E5FF" font-size="14" letter-spacing="5" opacity="0.5">///</text>
    <text x="330" y="272" fill="#8B5CF6" font-size="14" font-weight="600" letter-spacing="5">CYBERSECURITY</text>
    <text x="530" y="272" fill="#00E5FF" font-size="14" letter-spacing="5" opacity="0.5">///</text>
    <text x="570" y="272" fill="#00E5FF" font-size="14" font-weight="600" letter-spacing="5">APPLIED AI</text>

    <!-- Location -->
    <text x="82" y="308" fill="#94A3B8" font-size="12" letter-spacing="3" opacity="0.5">BENGALURU, INDIA</text>

  </g>
</svg>