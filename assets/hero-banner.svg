<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Mayur Kiran Kumar S — Software Engineer, Cybersecurity, Applied AI</title>
  <desc id="hero-desc">Premium dark hero banner with neural network visualization</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#0A0E18"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" x2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="80%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex-grid" width="60" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <path d="M30 0 L60 15 L60 37 L30 52 L0 37 L0 15 Z" fill="none" stroke="#94A3B8" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
    <pattern id="scan-lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 2h4" stroke="#FFFFFF" stroke-opacity="0.015" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1280" height="400" rx="12" fill="url(#bg-grad)"/>
  <rect width="1280" height="400" rx="12" fill="url(#hex-grid)"/>
  <rect width="1280" height="400" rx="12" fill="url(#scan-lines)"/>

  <!-- Ambient glows -->
  <ellipse cx="900" cy="180" rx="400" ry="250" fill="url(#glow-cyan)"/>
  <ellipse cx="350" cy="250" rx="300" ry="200" fill="url(#glow-violet)"/>

  <!-- Neural network nodes and connections - right side -->
  <g opacity="0.6" filter="url(#soft-glow)">
    <!-- Connection lines -->
    <line x1="780" y1="80" x2="880" y2="140" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="0.8"/>
    <line x1="880" y1="140" x2="960" y2="90" stroke="#8B5CF6" stroke-opacity="0.15" stroke-width="0.8"/>
    <line x1="880" y1="140" x2="1020" y2="180" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="0.8"/>
    <line x1="960" y1="90" x2="1080" y2="120" stroke="#8B5CF6" stroke-opacity="0.15" stroke-width="0.8"/>
    <line x1="1020" y1="180" x2="1140" y2="150" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="0.8"/>
    <line x1="1020" y1="180" x2="1060" y2="260" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="0.8"/>
    <line x1="1140" y1="150" x2="1200" y2="200" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="0.8"/>
    <line x1="1080" y1="120" x2="1140" y2="150" stroke="#8B5CF6" stroke-opacity="0.15" stroke-width="0.8"/>
    <line x1="1060" y1="260" x2="1160" y2="290" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="0.8"/>
    <line x1="1200" y1="200" x2="1160" y2="290" stroke="#8B5CF6" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="780" y1="80" x2="840" y2="40" stroke="#00E5FF" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="960" y1="90" x2="1000" y2="40" stroke="#8B5CF6" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="1060" y1="260" x2="980" y2="320" stroke="#00E5FF" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="1160" y1="290" x2="1220" y2="340" stroke="#8B5CF6" stroke-opacity="0.1" stroke-width="0.8"/>

    <!-- Nodes -->
    <circle cx="780" cy="80" r="3" fill="#00E5FF" opacity="0.8"/>
    <circle cx="880" cy="140" r="4" fill="#8B5CF6" opacity="0.9"/>
    <circle cx="960" cy="90" r="2.5" fill="#00E5FF" opacity="0.7"/>
    <circle cx="1020" cy="180" r="3.5" fill="#00E5FF" opacity="0.8"/>
    <circle cx="1080" cy="120" r="2" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="1140" cy="150" r="3" fill="#00E5FF" opacity="0.7"/>
    <circle cx="1200" cy="200" r="2.5" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="1060" cy="260" r="3" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="1160" cy="290" r="2" fill="#00E5FF" opacity="0.6"/>
    <circle cx="840" cy="40" r="2" fill="#00E5FF" opacity="0.4"/>
    <circle cx="1000" cy="40" r="1.5" fill="#8B5CF6" opacity="0.4"/>
    <circle cx="980" cy="320" r="2" fill="#00E5FF" opacity="0.4"/>
    <circle cx="1220" cy="340" r="1.5" fill="#8B5CF6" opacity="0.3"/>
  </g>

  <!-- Circuit traces - bottom edge -->
  <g stroke="#00E5FF" stroke-opacity="0.08" stroke-width="1" fill="none">
    <path d="M0 380 H120 L140 360 H200 L210 370 H280"/>
    <path d="M1280 380 H1160 L1140 360 H1080 L1070 370 H1000"/>
    <path d="M0 390 H80 L100 375 H160"/>
    <path d="M1280 390 H1200 L1180 375 H1120"/>
  </g>

  <!-- Circuit traces - top edge -->
  <g stroke="#8B5CF6" stroke-opacity="0.06" stroke-width="0.8" fill="none">
    <path d="M800 10 H900 L920 30 H980 L990 20 H1060"/>
    <path d="M1100 10 H1160 L1170 25 H1220"/>
  </g>

  <!-- Geometric structure - right side -->
  <g transform="translate(1100, 180)" opacity="0.35">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-dasharray="3 6"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#8B5CF6" stroke-width="0.6" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#94A3B8" stroke-opacity="0.3" stroke-width="0.5"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#94A3B8" stroke-opacity="0.3" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#00E5FF" opacity="0.8"/>
    <circle cx="60" cy="0" r="2" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="0" cy="-60" r="2" fill="#00E5FF" opacity="0.6"/>
    <circle cx="-40" cy="0" r="1.5" fill="#8B5CF6" opacity="0.5"/>
    <circle cx="0" cy="40" r="1.5" fill="#00E5FF" opacity="0.5"/>
  </g>

  <!-- Horizontal accent line -->
  <rect x="80" y="340" width="500" height="1" fill="url(#accent-line)" opacity="0.5"/>

  <!-- Typography -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Overline -->
    <text x="80" y="110" fill="#00E5FF" font-size="11" font-weight="700" letter-spacing="6" opacity="0.7">SYSTEMS ENGINEER</text>

    <!-- Name -->
    <text x="80" y="175" fill="#FFFFFF" font-size="48" font-weight="900" letter-spacing="2">MAYUR KIRAN KUMAR S</text>

    <!-- Role -->
    <text x="82" y="215" fill="#94A3B8" font-size="15" font-weight="600" letter-spacing="4">SOFTWARE ENGINEER</text>
    <text x="298" y="215" fill="#94A3B8" font-size="15" letter-spacing="4" opacity="0.4">|</text>
    <text x="322" y="215" fill="#8B5CF6" font-size="15" font-weight="600" letter-spacing="4">CYBERSECURITY</text>
    <text x="510" y="215" fill="#94A3B8" font-size="15" letter-spacing="4" opacity="0.4">|</text>
    <text x="534" y="215" fill="#00E5FF" font-size="15" font-weight="600" letter-spacing="4">APPLIED AI</text>

    <!-- Location -->
    <text x="82" y="255" fill="#94A3B8" font-size="12" letter-spacing="2" opacity="0.6">BENGALURU, INDIA</text>

    <!-- Statement -->
    <text x="82" y="310" fill="#CBD5E1" font-size="14" font-weight="400" letter-spacing="0.5" opacity="0.8">Engineering secure systems at the intersection of defense and intelligence.</text>
  </g>
</svg>