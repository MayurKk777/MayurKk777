<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 400" width="100%">
  <defs>
    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="2;6;2" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rainGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#030605" stop-opacity="0"/>
      <stop offset="85%" stop-color="#030605" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030605" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="transparent"/>
      <rect y="2" width="4" height="2" fill="#000" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="900" height="400" fill="#030605"/>

  <!-- Terminal frame -->
  <rect x="8" y="8" width="884" height="384" rx="8" fill="none" stroke="#008F11" stroke-width="1.5" opacity="0.6"/>
