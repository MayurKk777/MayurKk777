<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="Predictive Maintenance">
  <defs>
    <linearGradient id="amb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#B8FF6B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="amg"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="ambg" cx="0.75" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#10101E"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>
  </defs>
  <rect width="800" height="220" rx="10" fill="url(#ambg)" stroke="url(#amb)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.7;0.3;0.7" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Telemetry waveform -->
  <g transform="translate(440, 110)" opacity="0.5" filter="url(#amg)">
    <!-- Primary signal -->
    <path d="M-40 0 L-25-28 L-10 20 L5-35 L20 15 L35-40 L50 25 L65-20 L80 8 L95-30 L110 18 L125-15 L140 5 L155-35 L170 15 L185-25 L200 12 L215-30 L230 18 L245-12 L260 5 L275-22 L290 10 L305 0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Secondary signal -->
    <path d="M-40 5 L-20 -10 L0 15 L20 -8 L40 12 L60-15 L80 8 L100-12 L120 14 L140-8 L160 10 L180-14 L200 8 L220-10 L240 12 L260-6 L280 5 L305 2" fill="none" stroke="#B8FF6B" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.2;0.4" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Data points with pulse -->
    <circle cx="5" cy="-35" r="3" fill="#8B5CF6" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="-40" r="3.5" fill="#8B5CF6" opacity="0.9">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="-30" r="3" fill="#8B5CF6" opacity="0.7">
      <animate attributeName="r" values="3;4.5;3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="155" cy="-35" r="3" fill="#8B5CF6" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="215" cy="-30" r="2.5" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="275" cy="-22" r="2.5" fill="#8B5CF6" opacity="0.5"/>
    <!-- Threshold line -->
    <line x1="-50" y1="-45" x2="310" y2="-45" stroke="#B8FF6B" stroke-width="0.6" opacity="0.25" stroke-dasharray="5 5">
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3s" repeatCount="indefinite"/>
    </line>
    <text x="315" y="-42" fill="#B8FF6B" font-family="monospace" font-size="7" opacity="0.5">THRESHOLD</text>
    <!-- Baseline -->
    <line x1="-50" y1="40" x2="310" y2="40" stroke="#94A3B8" stroke-width="0.4" opacity="0.15"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="42" fill="#8B5CF6" font-size="10" font-weight="700" letter-spacing="5" opacity="0.5">04 — FEATURED PROJECT</text>
    <text x="36" y="80" fill="#FFFFFF" font-size="28" font-weight="900" letter-spacing="3">PREDICTIVE</text>
    <text x="36" y="110" fill="#FFFFFF" font-size="28" font-weight="900" letter-spacing="3">MAINTENANCE</text>
    <text x="36" y="140" fill="#CBD5E1" font-size="14" font-weight="400" letter-spacing="0.5" opacity="0.8">Automotive telemetry analysis</text>
    <text x="36" y="168" fill="#94A3B8" font-size="12" opacity="0.6" letter-spacing="0.5">Python · Failure Prediction · XAI · RUL Scoring</text>
    <text x="36" y="200" fill="#8B5CF6" font-size="11" font-weight="600" letter-spacing="2" opacity="0.5">VIEW PROJECT →</text>
  </g>
</svg>