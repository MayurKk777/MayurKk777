<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="100%">
  <defs>
    <filter id="crGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="1.5;4;1.5" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="txtGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#050303" stop-opacity="0"/>
      <stop offset="80%" stop-color="#050303" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050303" stop-opacity="0.7"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="transparent"/>
      <rect y="2" width="4" height="2" fill="#000" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="480" height="340" fill="#050303"/>
  <!-- Subtle grid -->
  <g opacity="0.06">
    <line x1="0" y1="0" x2="0" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="280" y1="0" x2="280" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="440" y1="0" x2="440" y2="340" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="480" y2="40" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="480" y2="80" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="480" y2="120" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="480" y2="160" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="480" y2="200" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="480" y2="240" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="480" y2="280" stroke="#8B0000" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="480" y2="320" stroke="#8B0000" stroke-width="0.5"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#8B0000" stroke-width="1.5" fill="none" opacity="0.5">
    <polyline points="5,20 5,5 20,5"/>
    <polyline points="460,5 475,5 475,20"/>
    <polyline points="475,320 475,335 460,335"/>
    <polyline points="20,335 5,335 5,320"/>
  </g>

  <!-- Terminal boot text (animated reveal) -->
  <g font-family="monospace" font-size="8" fill="#591515" opacity="0.5">
    <text x="25" y="25">
      [BIOS] INIT v4.2.7
      <animate attributeName="opacity" values="0;0.5;0.5" dur="1s" fill="freeze" repeatCount="1"/>
    </text>
    <text x="25" y="36">
      [LOAD] USER PROFILE........OK
      <animate attributeName="opacity" values="0;0;0.4;0.4" dur="2s" fill="freeze" repeatCount="1"/>
    </text>
    <text x="25" y="47">
      [CRYPT] CONNECTION.......ESTABLISHED
      <animate attributeName="opacity" values="0;0;0;0.4;0.4" dur="3s" fill="freeze" repeatCount="1"/>
    </text>
    <text x="25" y="58">
      [SEC] MODULE.............ONLINE
      <animate attributeName="opacity" values="0;0;0;0;0.4;0.4" dur="4s" fill="freeze" repeatCount="1"/>
    </text>
  </g>

  <!-- SYSTEM ENGINEER // EST. 2026 -->
  <text x="30" y="95" font-family="monospace" font-size="10" fill="#A85C5C" letter-spacing="4" opacity="0.8">
    SYSTEMS ENGINEER // EST. 2026
  </text>
  <!-- Animated underline -->
  <line x1="30" y1="100" x2="280" y2="100" stroke="#8B0000" stroke-width="0.5" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- MAYUR KIRAN -->
  <g filter="url(#crGlow)">
    <text x="30" y="140" font-family="monospace" font-size="42" font-weight="bold" fill="#FF2020" letter-spacing="3">MAYUR KIRAN</text>
  </g>
  <!-- KUMAR S -->
  <g filter="url(#crGlow)">
    <text x="30" y="185" font-family="monospace" font-size="42" font-weight="bold" fill="#FF2020" letter-spacing="3">KUMAR S</text>
  </g>

  <!-- Glitch layers -->
  <text x="32" y="139" font-family="monospace" font-size="42" font-weight="bold" fill="#FF7777" letter-spacing="3" opacity="0">
    MAYUR KIRAN
    <animate attributeName="opacity" values="0;0.25;0;0;0;0;0;0.18;0;0;0;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="32;34;28;32" dur="0.12s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="186" font-family="monospace" font-size="42" font-weight="bold" fill="#FF4444" letter-spacing="3" opacity="0">
    KUMAR S
    <animate attributeName="opacity" values="0;0;0;0.15;0;0;0;0;0;0.2;0;0;0" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Role line -->
  <text x="30" y="215" font-family="monospace" font-size="10.5" fill="#A85C5C" letter-spacing="1">
    SOFTWARE ENGINEERING ///
  </text>
  <text x="258" y="215" font-family="monospace" font-size="10.5" fill="#FF3333" letter-spacing="1" font-weight="bold">
    CYBERSECURITY
  </text>
  <text x="30" y="230" font-family="monospace" font-size="10.5" fill="#FF7777" letter-spacing="1" font-weight="bold">
    APPLIED AI
  </text>

  <!-- Location -->
  <text x="30" y="255" font-family="monospace" font-size="9" fill="#591515" letter-spacing="2">BENGALURU, INDIA</text>

  <!-- Separator line -->
  <line x1="30" y1="272" x2="420" y2="272" stroke="#391012" stroke-width="0.5"/>
  <!-- Animated pulse on separator -->
  <circle cy="272" r="2" fill="#FF2020" opacity="0.5">
    <animate attributeName="cx" values="30;420;30" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Status indicators -->
  <g font-family="monospace" font-size="9" fill="#A85C5C">
    <!-- SYS:ACTIVE -->
    <circle cx="38" cy="295" r="3" fill="#FF2020">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="298">SYS:ACTIVE</text>
    <!-- SEC:ARMED -->
    <circle cx="145" cy="295" r="3" fill="#FF2020">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="155" y="298">SEC:ARMED</text>
    <!-- AI:ONLINE -->
    <circle cx="250" cy="295" r="3" fill="#FF2020">
      <animate attributeName="opacity" values="1;1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="260" y="298">AI:ONLINE</text>
  </g>

  <!-- Hex footer -->
  <text x="30" y="325" font-family="monospace" font-size="7" fill="#391012" opacity="0.4">
    0x4D415955524B // PID:7777 // SESSION:0xFFAA22 // UPTIME:∞
  </text>

  <!-- Blinking cursor after name -->
  <rect x="365" y="168" width="8" height="18" fill="#FF2020">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanlines -->
  <rect width="480" height="340" fill="url(#scan)" opacity="0.4"/>
  <!-- Vignette -->
  <rect width="480" height="340" fill="url(#vig)"/>
</svg>
