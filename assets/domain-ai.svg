<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Applied AI">
  <defs>
    <filter id="ng2">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="abg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#120D22"/>
      <stop offset="100%" stop-color="#111722"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="38" fill="url(#abg)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(40,40)" filter="url(#ng2)">
    <!-- Central brain node -->
    <circle cx="0" cy="0" r="6" fill="#8B5CF6" opacity="0.9">
      <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Orbital nodes -->
    <circle cx="-16" cy="-14" r="3.5" fill="#8B5CF6" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="-14" r="3.5" fill="#8B5CF6" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-18" cy="12" r="3" fill="#8B5CF6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="12" r="3" fill="#8B5CF6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="20" r="2.5" fill="#8B5CF6" opacity="0.5"/>
    <!-- Connections -->
    <line x1="-16" y1="-14" x2="0" y2="0" stroke="#8B5CF6" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="16" y1="-14" x2="0" y2="0" stroke="#8B5CF6" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="-18" y1="12" x2="0" y2="0" stroke="#8B5CF6" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="18" y1="12" x2="0" y2="0" stroke="#8B5CF6" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="20" x2="0" y2="0" stroke="#8B5CF6" stroke-width="0.8" opacity="0.3"/>
    <line x1="-16" y1="-14" x2="16" y2="-14" stroke="#8B5CF6" stroke-width="0.5" opacity="0.2"/>
    <line x1="-18" y1="12" x2="18" y2="12" stroke="#8B5CF6" stroke-width="0.5" opacity="0.2"/>
  </g>
</svg>