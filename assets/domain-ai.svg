<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Applied AI">
  <defs>
    <filter id="glow-a">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#111722" stroke="#1E293B" stroke-width="1"/>
  <g transform="translate(32,32)" filter="url(#glow-a)">
    <!-- Neural network nodes -->
    <circle cx="-12" cy="-12" r="3" fill="#8B5CF6" opacity="0.9"/>
    <circle cx="12" cy="-12" r="3" fill="#8B5CF6" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#8B5CF6" opacity="1"/>
    <circle cx="-14" cy="10" r="2.5" fill="#8B5CF6" opacity="0.7"/>
    <circle cx="14" cy="10" r="2.5" fill="#8B5CF6" opacity="0.7"/>
    <circle cx="0" cy="16" r="2" fill="#8B5CF6" opacity="0.6"/>
    <!-- Connections -->
    <line x1="-12" y1="-12" x2="0" y2="0" stroke="#8B5CF6" stroke-width="0.8" opacity="0.5"/>
    <line x1="12" y1="-12" x2="0" y2="0" stroke="#8B5CF6" stroke-width="0.8" opacity="0.5"/>
    <line x1="-14" y1="10" x2="0" y2="0" stroke="#8B5CF6" stroke-width="0.8" opacity="0.5"/>
    <line x1="14" y1="10" x2="0" y2="0" stroke="#8B5CF6" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="16" x2="0" y2="0" stroke="#8B5CF6" stroke-width="0.8" opacity="0.4"/>
    <line x1="-12" y1="-12" x2="-14" y2="10" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3"/>
    <line x1="12" y1="-12" x2="14" y2="10" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3"/>
  </g>
</svg>