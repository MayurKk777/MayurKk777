<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="100%" height="70">
  <rect width="1200" height="70" fill="#030303"/>
  
  <!-- Gradient line -->
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030303"/>
      <stop offset="30%" stop-color="#DC143C" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FF1744" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#DC143C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>
  </defs>
  
  <line x1="0" y1="10" x2="1200" y2="10" stroke="url(#footGrad)" stroke-width="1"/>
  
  <!-- Signature text -->
  <text x="600" y="35" fill="#9B4654" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="1">
    Build systems that keep working when the stakes are highest.
  </text>
  
  <!-- Bottom accent -->
  <text x="600" y="52" fill="#650014" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="3" opacity="0.6">
    ◆ MAYUR KIRAN KUMAR S ◆ 2026 ◆
  </text>
  
  <!-- Corner marks -->
  <polyline points="20,15 20,60 30,60" stroke="#650014" stroke-width="0.5" fill="none" opacity="0.4"/>
  <polyline points="1180,15 1180,60 1170,60" stroke="#650014" stroke-width="0.5" fill="none" opacity="0.4"/>
</svg>