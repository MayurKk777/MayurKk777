<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="100%">
  <defs>
    <filter id="fg" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="frg" x="-5%" y="-10%" width="110%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="100" fill="#030605"/>
  
  <!-- ASCII border top -->
  <text x="50" y="15" font-family="monospace" font-size="8" fill="#008F11" opacity="0.3">╔══════════════════════════════════════════════════════════════════════════════════════════════════════════╗</text>
  
  <!-- Main quote -->
  <g filter="url(#fg)">
    <text x="450" y="45" text-anchor="middle" font-family="monospace" font-size="13" fill="#008F11" opacity="0.8">// Build systems that keep working when the stakes are highest</text>
  </g>
  
  <!-- Hex timestamp -->
  <text x="450" y="65" text-anchor="middle" font-family="monospace" font-size="9" fill="#4CAF50" opacity="0.3">
    [TIMESTAMP: 0x674D4159 | SESSION: 0xFFFFFF | PID: 7777]
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </text>
  
  <!-- Mini matrix rain at bottom -->
  <g filter="url(#frg)" opacity="0.2">
    <g><text font-family="monospace" font-size="10" fill="#00FF41"><tspan x="80" dy="12">ア</tspan><tspan x="80" dy="12">3</tspan><tspan x="80" dy="12">F</tspan><animateTransform attributeName="transform" type="translate" values="0,-10;0,40" dur="3s" repeatCount="indefinite"/></text></g>
    <g><text font-family="monospace" font-size="10" fill="#00FF41"><tspan x="200" dy="12">1</tspan><tspan x="200" dy="12">ク</tspan><tspan x="200" dy="12">B</tspan><animateTransform attributeName="transform" type="translate" values="0,-5;0,40" dur="4s" repeatCount="indefinite"/></text></g>
    <g><text font-family="monospace" font-size="10" fill="#00FF41"><tspan x="350" dy="12">カ</tspan><tspan x="350" dy="12">7</tspan><tspan x="350" dy="12">D</tspan><animateTransform attributeName="transform" type="translate" values="0,-15;0,40" dur="2.5s" repeatCount="indefinite"/></text></g>
    <g><text font-family="monospace" font-size="10" fill="#00FF41"><tspan x="500" dy="12">9</tspan><tspan x="500" dy="12">サ</tspan><tspan x="500" dy="12">E</tspan><animateTransform attributeName="transform" type="translate" values="0,-8;0,40" dur="3.5s" repeatCount="indefinite"/></text></g>
    <g><text font-family="monospace" font-size="10" fill="#00FF41"><tspan x="650" dy="12">タ</tspan><tspan x="650" dy="12">0</tspan><tspan x="650" dy="12">A</tspan><animateTransform attributeName="transform" type="translate" values="0,-12;0,40" dur="2.8s" repeatCount="indefinite"/></text></g>
    <g><text font-family="monospace" font-size="10" fill="#00FF41"><tspan x="780" dy="12">C</tspan><tspan x="780" dy="12">ナ</tspan><tspan x="780" dy="12">5</tspan><animateTransform attributeName="transform" type="translate" values="0,-3;0,40" dur="3.2s" repeatCount="indefinite"/></text></g>
  </g>
  
  <!-- ASCII border bottom -->
  <text x="50" y="95" font-family="monospace" font-size="8" fill="#008F11" opacity="0.3">╚══════════════════════════════════════════════════════════════════════════════════════════════════════════╝</text>
</svg>