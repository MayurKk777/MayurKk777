<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="CarbonTrust">
  <defs>
    <linearGradient id="cb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8FF6B" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B8FF6B" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="cg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="cbg" cx="0.75" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#0D1A10"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>
  </defs>
  <rect width="800" height="220" rx="10" fill="url(#cbg)" stroke="url(#cb)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.7;0.3;0.7" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Blockchain visualization -->
  <g transform="translate(530, 110)" opacity="0.55" filter="url(#cg)">
    <!-- Chain blocks -->
    <g>
      <rect x="-110" y="-18" width="36" height="36" rx="5" fill="#0D1117" stroke="#B8FF6B" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="-55" y="-18" width="36" height="36" rx="5" fill="#0D1117" stroke="#B8FF6B" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="-18" width="36" height="36" rx="5" fill="#0D1117" stroke="#B8FF6B" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="55" y="-18" width="36" height="36" rx="5" fill="#0D1117" stroke="#B8FF6B" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="110" y="-18" width="36" height="36" rx="5" fill="#0D1117" stroke="#B8FF6B" stroke-width="1.2" opacity="0.7"/>
    </g>
    <!-- Chain links with animated flow -->
    <line x1="-74" y1="0" x2="-55" y2="0" stroke="#B8FF6B" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="-19" y1="0" x2="0" y2="0" stroke="#B8FF6B" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="36" y1="0" x2="55" y2="0" stroke="#B8FF6B" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="91" y1="0" x2="110" y2="0" stroke="#B8FF6B" stroke-width="1.2" opacity="0.4"/>
    <!-- Block hashes -->
    <text x="-102" y="5" fill="#B8FF6B" font-family="monospace" font-size="8" opacity="0.7">0xA3</text>
    <text x="-47" y="5" fill="#B8FF6B" font-family="monospace" font-size="8" opacity="0.7">0xF1</text>
    <text x="8" y="5" fill="#B8FF6B" font-family="monospace" font-size="8" opacity="0.7">0x7C</text>
    <text x="63" y="5" fill="#B8FF6B" font-family="monospace" font-size="8" opacity="0.7">0xBE</text>
    <text x="118" y="5" fill="#B8FF6B" font-family="monospace" font-size="8" opacity="0.5">0x92</text>
    <!-- IoT sensors -->
    <circle cx="-92" cy="-55" r="4" fill="#00E5FF" opacity="0.6">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-92" cy="-55" r="10" fill="none" stroke="#00E5FF" stroke-width="0.6" opacity="0.3">
      <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="-50" r="4" fill="#00E5FF" opacity="0.5">
      <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="-50" r="10" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.2">
      <animate attributeName="r" values="10;15;10" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="-92" y1="-51" x2="-92" y2="-18" stroke="#00E5FF" stroke-width="0.6" opacity="0.3" stroke-dasharray="2 3"/>
    <line x1="128" y1="-46" x2="128" y2="-18" stroke="#00E5FF" stroke-width="0.6" opacity="0.2" stroke-dasharray="2 3"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="42" fill="#B8FF6B" font-size="10" font-weight="700" letter-spacing="5" opacity="0.5">02 — FEATURED PROJECT</text>
    <text x="36" y="85" fill="#FFFFFF" font-size="32" font-weight="900" letter-spacing="4">CARBONTRUST</text>
    <text x="36" y="115" fill="#CBD5E1" font-size="14" font-weight="400" letter-spacing="0.5" opacity="0.8">Blockchain-based carbon-credit verification</text>
    <text x="36" y="148" fill="#94A3B8" font-size="12" opacity="0.6" letter-spacing="0.5">ESP32 · MQTT · Solidity · Polygon Amoy · IPFS</text>
    <text x="36" y="185" fill="#B8FF6B" font-size="11" font-weight="600" letter-spacing="2" opacity="0.5">VIEW PROJECT →</text>
  </g>
</svg>