<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-label="CarbonTrust Project">
  <defs>
    <linearGradient id="ct-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8FF6B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="ct-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="ct-bg" cx="0.8" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#0D1A10"/>
      <stop offset="100%" stop-color="#111722"/>
    </radialGradient>
  </defs>
  <rect width="800" height="200" rx="8" fill="url(#ct-bg)" stroke="url(#ct-border)" stroke-width="1"/>

  <!-- Blockchain chain visualization -->
  <g transform="translate(560, 100)" opacity="0.45" filter="url(#ct-glow)">
    <!-- Chain blocks -->
    <rect x="-90" y="-15" width="30" height="30" rx="4" fill="none" stroke="#B8FF6B" stroke-width="1.2"/>
    <rect x="-45" y="-15" width="30" height="30" rx="4" fill="none" stroke="#B8FF6B" stroke-width="1.2"/>
    <rect x="0" y="-15" width="30" height="30" rx="4" fill="none" stroke="#B8FF6B" stroke-width="1.2"/>
    <rect x="45" y="-15" width="30" height="30" rx="4" fill="none" stroke="#B8FF6B" stroke-width="1.2"/>
    <rect x="90" y="-15" width="30" height="30" rx="4" fill="none" stroke="#B8FF6B" stroke-width="1"/>
    <!-- Chain links -->
    <line x1="-60" y1="0" x2="-45" y2="0" stroke="#B8FF6B" stroke-width="1" opacity="0.6"/>
    <line x1="-15" y1="0" x2="0" y2="0" stroke="#B8FF6B" stroke-width="1" opacity="0.6"/>
    <line x1="30" y1="0" x2="45" y2="0" stroke="#B8FF6B" stroke-width="1" opacity="0.6"/>
    <line x1="75" y1="0" x2="90" y2="0" stroke="#B8FF6B" stroke-width="1" opacity="0.5"/>
    <!-- Block hashes -->
    <text x="-82" y="4" fill="#B8FF6B" font-family="monospace" font-size="7" opacity="0.6">0xA3</text>
    <text x="-37" y="4" fill="#B8FF6B" font-family="monospace" font-size="7" opacity="0.6">0xF1</text>
    <text x="8" y="4" fill="#B8FF6B" font-family="monospace" font-size="7" opacity="0.6">0x7C</text>
    <text x="53" y="4" fill="#B8FF6B" font-family="monospace" font-size="7" opacity="0.6">0xBE</text>
    <text x="98" y="4" fill="#B8FF6B" font-family="monospace" font-size="7" opacity="0.5">0x92</text>
    <!-- IoT sensor signals -->
    <circle cx="-75" cy="-50" r="3" fill="#00E5FF" opacity="0.5"/>
    <circle cx="-75" cy="-50" r="8" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.3"/>
    <circle cx="-75" cy="-50" r="14" fill="none" stroke="#00E5FF" stroke-width="0.3" opacity="0.15"/>
    <circle cx="105" cy="-45" r="3" fill="#00E5FF" opacity="0.4"/>
    <circle cx="105" cy="-45" r="8" fill="none" stroke="#00E5FF" stroke-width="0.4" opacity="0.2"/>
    <line x1="-75" y1="-47" x2="-75" y2="-15" stroke="#00E5FF" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 3"/>
    <line x1="105" y1="-42" x2="105" y2="-15" stroke="#00E5FF" stroke-width="0.5" opacity="0.2" stroke-dasharray="2 3"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="48" fill="#B8FF6B" font-size="10" font-weight="700" letter-spacing="4" opacity="0.6">02 — PROJECT</text>
    <text x="40" y="85" fill="#FFFFFF" font-size="28" font-weight="900" letter-spacing="3">CARBONTRUST</text>
    <text x="40" y="115" fill="#94A3B8" font-size="13" font-weight="400" letter-spacing="1">Blockchain Carbon-Credit Verification</text>
    <text x="40" y="155" fill="#CBD5E1" font-size="11" opacity="0.7">ESP32  ·  MQTT  ·  Solidity  ·  Polygon Amoy  ·  IPFS</text>
  </g>
</svg>