<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="CipherGuard">
  <defs>
    <linearGradient id="cgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="cgg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="cgbg" cx="0.75" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>
  </defs>
  <rect width="800" height="220" rx="10" fill="url(#cgbg)" stroke="url(#cgb)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.8;0.35;0.8" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Shield visualization -->
  <g transform="translate(630, 110)" opacity="0.5" filter="url(#cgg)">
    <path d="M0-65 L55-40 L55 10 C55 45 27 65 0 78 C-27 65 -55 45 -55 10 L-55-40 Z" fill="none" stroke="#00E5FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0-48 L40-30 L40 5 C40 30 20 45 0 55 C-20 45 -40 30 -40 5 L-40-30 Z" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="5s" repeatCount="indefinite"/>
    </path>
    <!-- Lock -->
    <circle cx="0" cy="-5" r="10" fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-5" r="4" fill="#00E5FF" opacity="0.7">
      <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="-2.5" y="-2" width="5" height="12" rx="1" fill="#00E5FF" opacity="0.5"/>
    <!-- Floating hash particles -->
    <g fill="#8B5CF6">
      <circle cx="-65" cy="-45" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="-58" cy="-30" r="2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="-70" cy="-15" r="1" opacity="0.3"/>
      <circle cx="65" cy="-45" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="58" cy="-30" r="2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="-15" r="1" opacity="0.3"/>
      <circle cx="-62" cy="30" r="1.5" opacity="0.3"/>
      <circle cx="62" cy="30" r="1.5" opacity="0.3"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="42" fill="#00E5FF" font-size="10" font-weight="700" letter-spacing="5" opacity="0.5">03 — FEATURED PROJECT</text>
    <text x="36" y="85" fill="#FFFFFF" font-size="32" font-weight="900" letter-spacing="4">CIPHERGUARD</text>
    <text x="36" y="115" fill="#CBD5E1" font-size="14" font-weight="400" letter-spacing="0.5" opacity="0.8">Password security analysis framework</text>
    <text x="36" y="148" fill="#94A3B8" font-size="12" opacity="0.6" letter-spacing="0.5">Python · bcrypt · Argon2id · SSE · Cracking Analysis</text>
    <text x="36" y="185" fill="#00E5FF" font-size="11" font-weight="600" letter-spacing="2" opacity="0.5">VIEW PROJECT →</text>
  </g>
</svg>