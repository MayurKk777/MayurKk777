<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Backend Engineering">
  <defs>
    <filter id="glow-b">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#111722" stroke="#1E293B" stroke-width="1"/>
  <g transform="translate(32,32)" filter="url(#glow-b)">
    <!-- Server stack -->
    <rect x="-12" y="-16" width="24" height="8" rx="2" fill="none" stroke="#B8FF6B" stroke-width="1.4" opacity="0.9"/>
    <rect x="-12" y="-5" width="24" height="8" rx="2" fill="none" stroke="#B8FF6B" stroke-width="1.4" opacity="0.7"/>
    <rect x="-12" y="6" width="24" height="8" rx="2" fill="none" stroke="#B8FF6B" stroke-width="1.4" opacity="0.5"/>
    <!-- Status dots -->
    <circle cx="8" cy="-12" r="1.5" fill="#B8FF6B" opacity="0.9"/>
    <circle cx="8" cy="-1" r="1.5" fill="#B8FF6B" opacity="0.7"/>
    <circle cx="8" cy="10" r="1.5" fill="#B8FF6B" opacity="0.5"/>
  </g>
</svg>