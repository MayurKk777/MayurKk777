  </defs>
  <rect width="1280" height="360" rx="16" fill="url(#bg)"/><rect width="1280" height="360" rx="16" fill="url(#grid)"/>
  <path d="M0 58H1280M0 302H1280" stroke="url(#rgb)" stroke-width="2" opacity=".85"/><path d="M0 64H415M790 64H1280M0 296H328M920 296H1280" stroke="#fff" stroke-opacity=".16"/>
