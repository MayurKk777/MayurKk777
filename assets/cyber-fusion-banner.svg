  <g font-family="Arial, Helvetica, sans-serif"><text x="314" y="111" fill="#00f5ff" font-size="12" font-weight="700" letter-spacing="5">// SECURITY // SYSTEMS // INTELLIGENCE //</text><text x="314" y="168" fill="#f8fafc" font-size="40" font-weight="800" letter-spacing=".5">MAYUR KIRAN KUMAR S</text><text x="316" y="200" fill="#d8d3e8" font-size="16" font-weight="700" letter-spacing="2">BUILD. DEFEND. AUTOMATE.</text></g>
