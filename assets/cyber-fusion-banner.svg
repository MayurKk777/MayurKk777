<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Mayur Kiran Kumar S - Cybersecurity, Backend, AI</title>
  <desc id="desc">Aggressive RGB cyberpunk banner with glitch lines, a security shield, and an AI neural core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".5" stop-color="#11101a"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="rgb" x1="0" x2="1"><stop stop-color="#00f5ff"/><stop offset=".48" stop-color="#ff00e5"/><stop offset="1" stop-color="#b6ff00"/></linearGradient>
    <linearGradient id="magenta" x1="0" x2="1"><stop stop-color="#ff00e5" stop-opacity="0"/><stop offset=".5" stop-color="#ff00e5"/><stop offset="1" stop-color="#ff00e5" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
