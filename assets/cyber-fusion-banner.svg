<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Mayur Kiran Kumar S - Cybersecurity, Backend, and AI</title>
  <desc id="desc">A futuristic blue cyber command-center banner with circuit lines, a shield, and neural nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="52%" stop-color="#0b1f42"/>
      <stop offset="100%" stop-color="#071a2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="18%" stop-color="#38bdf8"/>
      <stop offset="82%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#60a5fa" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <ellipse cx="650" cy="165" rx="480" ry="240" fill="url(#glow)"/>
  <path d="M44 45H1236" stroke="url(#edge)" stroke-width="1"/>
  <path d="M44 315H1236" stroke="url(#edge)" stroke-width="1"/>

  <g fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 116H108l28 28h95" stroke-opacity=".54" stroke-width="1.5"/>
    <path d="M0 244h72l33-33h126" stroke-opacity=".36" stroke-width="1.5"/>
    <path d="M1280 103h-110l-30 30h-105" stroke-opacity=".54" stroke-width="1.5"/>
    <path d="M1280 258h-92l-28-28h-125" stroke-opacity=".36" stroke-width="1.5"/>
    <path d="M306 42v40l24 24" stroke-opacity=".45" stroke-width="1.25"/>
    <path d="M974 318v-42l-24-24" stroke-opacity=".45" stroke-width="1.25"/>
  </g>
  <g fill="#7dd3fc" filter="url(#softGlow)">
    <circle cx="108" cy="116" r="4"/><circle cx="72" cy="244" r="4"/>
    <circle cx="1170" cy="103" r="4"/><circle cx="1188" cy="258" r="4"/>
    <circle cx="330" cy="106" r="3"/><circle cx="950" cy="252" r="3"/>
  </g>

  <g transform="translate(128 104)">
    <path d="M68 0 124 22v53c0 42-25 69-56 82C37 144 12 117 12 75V22z" fill="#0b2a50" stroke="#38bdf8" stroke-width="2"/>
    <path d="M68 13 112 31v42c0 32-18 53-44 66-26-13-44-34-44-66V31z" fill="#0b1d37" stroke="#2563eb" stroke-width="1"/>
    <rect x="49" y="65" width="38" height="30" rx="5" fill="#38bdf8" fill-opacity=".16" stroke="#7dd3fc" stroke-width="2"/>
    <path d="M57 65v-10a11 11 0 0 1 22 0v10" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <circle cx="68" cy="80" r="4" fill="#7dd3fc"/>
    <path d="M68 84v5" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#f8fafc">
    <text x="332" y="112" font-size="13" font-weight="700" letter-spacing="4" fill="#7dd3fc">SYSTEMS / SECURITY / INTELLIGENCE</text>
    <text x="332" y="168" font-size="40" font-weight="700" letter-spacing=".3">MAYUR KIRAN KUMAR S</text>
    <text x="335" y="201" font-size="17" letter-spacing="1.2" fill="#cbd5e1">BUILDING RESILIENT, INTELLIGENT SOFTWARE</text>
  </g>

  <g transform="translate(332 240)" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">
    <rect width="128" height="29" rx="14.5" fill="#0e2d4f" stroke="#38bdf8" stroke-opacity=".7"/>
    <text x="20" y="19" fill="#bae6fd">CYBERSECURITY</text>
    <rect x="143" width="98" height="29" rx="14.5" fill="#102846" stroke="#60a5fa" stroke-opacity=".7"/>
    <text x="164" y="19" fill="#bfdbfe">BACKEND</text>
    <rect x="256" width="164" height="29" rx="14.5" fill="#152650" stroke="#818cf8" stroke-opacity=".7"/>
    <text x="278" y="19" fill="#c7d2fe">APPLIED AI</text>
  </g>

  <g transform="translate(1060 116)" fill="none" stroke="#93c5fd" stroke-width="1.3" stroke-opacity=".72">
    <circle cx="56" cy="64" r="48"/>
    <circle cx="56" cy="64" r="27" stroke-dasharray="4 6"/>
    <path d="M56 16v96M8 64h96M22 30l68 68M90 30 22 98" stroke-opacity=".38"/>
    <circle cx="56" cy="64" r="7" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="56" cy="16" r="3" fill="#7dd3fc"/><circle cx="104" cy="64" r="3" fill="#7dd3fc"/>
    <circle cx="56" cy="112" r="3" fill="#7dd3fc"/><circle cx="8" cy="64" r="3" fill="#7dd3fc"/>
  </g>
</svg>
