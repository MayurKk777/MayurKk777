<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Security Engineering">
  <defs>
    <filter id="ng">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="sbg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0D1B22"/>
      <stop offset="100%" stop-color="#111722"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="38" fill="url(#sbg)" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(40,38)" filter="url(#ng)">
    <path d="M0-22 L20-11 L20 8 C20 22 10 30 0 35 C-10 30 -20 22 -20 8 L-20-11 Z" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite"/>
    </path>
    <rect x="-6" y="-2" width="12" height="11" rx="2" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.7"/>
    <path d="M-5-2 L-5-7 A5 5 0 0 1 5-7 L5-2" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="4" r="2" fill="#00E5FF" opacity="0.9">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>