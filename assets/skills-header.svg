<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%">
  <defs>
    <filter id="tg" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="60" fill="#030605"/>
  <text x="30" y="38" font-family="monospace" font-size="13" fill="#008F11" opacity="0.6">root@mayur:~$ cat /etc/arsenal/skills.conf</text>
  <g filter="url(#tg)">
    <text x="560" y="38" font-family="monospace" font-size="22" font-weight="bold" fill="#00FF41" letter-spacing="6">TECHNICAL ARSENAL</text>
  </g>
  <!-- Glitch jitter -->
  <text x="560" y="38" font-family="monospace" font-size="22" font-weight="bold" fill="#00FFFF" letter-spacing="6" opacity="0">TECHNICAL ARSENAL<animate attributeName="opacity" values="0;0.2;0;0;0;0;0;0.15;0" dur="3s" repeatCount="indefinite"/><animate attributeName="x" values="560;562;558;560" dur="0.12s" repeatCount="indefinite"/></text>
  <!-- Blinking cursor -->
  <rect x="847" y="25" width="7" height="15" fill="#00FF41"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
  <text x="30" y="55" font-family="monospace" font-size="8" fill="#4CAF50" opacity="0.2">[0x534B494C] LOADING MODULES...</text>
</svg>