<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="RakshaSetu">
  <defs>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="rg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="rbg" cx="0.75" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#0A1520"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>
  </defs>
  <rect width="800" height="220" rx="10" fill="url(#rbg)" stroke="url(#rb)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.8;0.4;0.8" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Agent network -->
  <g transform="translate(620, 110)" opacity="0.6" filter="url(#rg)">
    <circle cx="0" cy="0" r="10" fill="#0D1117" stroke="#00E5FF" stroke-width="2">
      <animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#00E5FF" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-55" cy="-35" r="6" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="55" cy="-35" r="6" fill="#0D1117" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="-65" cy="25" r="6" fill="#0D1117" stroke="#B8FF6B" stroke-width="1.5"/>
    <circle cx="65" cy="25" r="6" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="-35" cy="55" r="5" fill="#0D1117" stroke="#00E5FF" stroke-width="1.2"/>
    <circle cx="35" cy="55" r="5" fill="#0D1117" stroke="#B8FF6B" stroke-width="1.2"/>
    <circle cx="0" cy="-60" r="5" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-55" y2="-35" stroke="#00E5FF" stroke-width="0.8" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="55" y2="-35" stroke="#8B5CF6" stroke-width="0.8" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="-65" y2="25" stroke="#B8FF6B" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="65" y2="25" stroke="#00E5FF" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="-35" y2="55" stroke="#8B5CF6" stroke-width="0.6" opacity="0.3"/>
    <line x1="0" y1="0" x2="35" y2="55" stroke="#00E5FF" stroke-width="0.6" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#B8FF6B" stroke-width="0.6" opacity="0.4"/>
    <!-- Radar rings -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.2" stroke-dasharray="3 5">
      <animate attributeName="r" values="30;35;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#8B5CF6" stroke-width="0.4" opacity="0.1" stroke-dasharray="2 6">
      <animate attributeName="r" values="55;65;55" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.02;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00E5FF" stroke-width="0.3" opacity="0.06">
      <animate attributeName="r" values="80;90;80" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="42" fill="#00E5FF" font-size="10" font-weight="700" letter-spacing="5" opacity="0.5">01 — FEATURED PROJECT</text>
    <text x="36" y="85" fill="#FFFFFF" font-size="32" font-weight="900" letter-spacing="4">RAKSHASETU</text>
    <text x="36" y="115" fill="#CBD5E1" font-size="14" font-weight="400" letter-spacing="0.5" opacity="0.8">Agentic multi-agent disaster-response system</text>
    <text x="36" y="148" fill="#94A3B8" font-size="12" opacity="0.6" letter-spacing="0.5">LangGraph · YOLO · RAG · FastAPI · Weather · UDP Alerts</text>
    <text x="36" y="185" fill="#00E5FF" font-size="11" font-weight="600" letter-spacing="2" opacity="0.5">VIEW PROJECT →</text>
  </g>
</svg>