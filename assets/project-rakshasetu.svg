<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-label="RakshaSetu Project">
  <defs>
    <linearGradient id="rs-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="rs-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="rs-bg" cx="0.8" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#0D1520"/>
      <stop offset="100%" stop-color="#111722"/>
    </radialGradient>
  </defs>
  <rect width="800" height="200" rx="8" fill="url(#rs-bg)" stroke="url(#rs-border)" stroke-width="1"/>

  <!-- Agent network visualization -->
  <g transform="translate(600, 100)" opacity="0.5" filter="url(#rs-glow)">
    <!-- Central supervisor node -->
    <circle cx="0" cy="0" r="8" fill="#111722" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#00E5FF" opacity="0.6"/>
    <!-- Agent nodes -->
    <circle cx="-50" cy="-30" r="5" fill="#111722" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="50" cy="-30" r="5" fill="#111722" stroke="#00E5FF" stroke-width="1"/>
    <circle cx="-60" cy="20" r="5" fill="#111722" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="60" cy="20" r="5" fill="#111722" stroke="#00E5FF" stroke-width="1"/>
    <circle cx="-30" cy="50" r="5" fill="#111722" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="30" cy="50" r="5" fill="#111722" stroke="#00E5FF" stroke-width="1"/>
    <circle cx="0" cy="-55" r="4" fill="#111722" stroke="#8B5CF6" stroke-width="1"/>
    <!-- Connections -->
    <line x1="0" y1="0" x2="-50" y2="-30" stroke="#00E5FF" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="0" x2="50" y2="-30" stroke="#8B5CF6" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="0" x2="-60" y2="20" stroke="#00E5FF" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="0" x2="60" y2="20" stroke="#8B5CF6" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="0" x2="-30" y2="50" stroke="#00E5FF" stroke-width="0.6" opacity="0.3"/>
    <line x1="0" y1="0" x2="30" y2="50" stroke="#8B5CF6" stroke-width="0.6" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#00E5FF" stroke-width="0.6" opacity="0.4"/>
    <!-- Radar pulse rings -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#00E5FF" stroke-width="0.4" opacity="0.2" stroke-dasharray="3 4"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#8B5CF6" stroke-width="0.3" opacity="0.15" stroke-dasharray="2 5"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#00E5FF" stroke-width="0.3" opacity="0.1" stroke-dasharray="2 6"/>
  </g>

  <!-- Text content -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="48" fill="#00E5FF" font-size="10" font-weight="700" letter-spacing="4" opacity="0.6">01 — PROJECT</text>
    <text x="40" y="85" fill="#FFFFFF" font-size="28" font-weight="900" letter-spacing="3">RAKSHASETU</text>
    <text x="40" y="115" fill="#94A3B8" font-size="13" font-weight="400" letter-spacing="1">Multi-Agent Disaster Response System</text>
    <text x="40" y="155" fill="#CBD5E1" font-size="11" opacity="0.7">LangGraph  ·  YOLO  ·  RAG  ·  FastAPI  ·  UDP Alerts</text>
  </g>
</svg>