  <rect x="860" y="25" width="7" height="15" fill="#00FF41"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
  <text x="30" y="55" font-family="monospace" font-size="8" fill="#4CAF50" opacity="0.2">[0x50524F4A] CLEARANCE: PUBLIC — ACCESS GRANTED</text>
