<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="100%">
  <defs>
    <filter id="gl" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="30" fill="#030605"/>
  <!-- Central line -->
  <line x1="50" y1="15" x2="850" y2="15" stroke="#008F11" stroke-width="0.5" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </line>
  <!-- Glowing center dot -->
  <circle cx="450" cy="15" r="2" fill="#00FF41" filter="url(#gl)">
    <animate attributeName="r" values="1.5;3;1.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Hex decorations -->
  <text x="120" y="18" font-family="monospace" font-size="8" fill="#008F11" opacity="0.25">0x4E5F</text>
  <text x="300" y="18" font-family="monospace" font-size="8" fill="#008F11" opacity="0.2">━━━━━━━━</text>
  <text x="550" y="18" font-family="monospace" font-size="8" fill="#008F11" opacity="0.2">━━━━━━━━</text>
  <text x="740" y="18" font-family="monospace" font-size="8" fill="#008F11" opacity="0.25">0xA3B7</text>
  <!-- Traveling dot -->
  <circle cy="15" r="1.5" fill="#00FFFF" opacity="0.6">
    <animate attributeName="cx" values="50;850;50" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>