<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030303" stop-opacity="1"/>
      <stop offset="15%" stop-color="#DC143C" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FF1744" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#DC143C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030303" stop-opacity="1"/>
      <stop offset="20%" stop-color="#650014" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#9B4654" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#650014" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="12" fill="#030303"/>
  <rect y="4" width="1200" height="4" fill="url(#glowGrad)" opacity="0.5"/>
  <line x1="0" y1="6" x2="1200" y2="6" stroke="url(#divGrad)" stroke-width="1"/>
  <line x1="0" y1="5" x2="1200" y2="5" stroke="url(#divGrad)" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="7" x2="1200" y2="7" stroke="url(#divGrad)" stroke-width="0.5" opacity="0.3"/>
  <!-- Small accent marks -->
  <rect x="580" y="3" width="40" height="6" rx="1" fill="#DC143C" opacity="0.15"/>
  <rect x="590" y="4.5" width="20" height="3" rx="0.5" fill="#FF1744" opacity="0.3"/>
</svg>

