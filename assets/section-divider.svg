<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="100%">
  <defs>
    <filter id="dg" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="30" fill="#050303"/>
  <line x1="50" y1="15" x2="850" y2="15" stroke="#391012" stroke-width="0.5" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle cx="450" cy="15" r="2" fill="#FF2020" filter="url(#dg)">
    <animate attributeName="r" values="1.5;3;1.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="18" font-family="monospace" font-size="8" fill="#591515" opacity="0.3">0x4E5F</text>
  <text x="280" y="18" font-family="monospace" font-size="8" fill="#391012" opacity="0.25">━━━━━━━━</text>
  <text x="560" y="18" font-family="monospace" font-size="8" fill="#391012" opacity="0.25">━━━━━━━━</text>
  <text x="760" y="18" font-family="monospace" font-size="8" fill="#591515" opacity="0.3">0xA3B7</text>
  <circle cy="15" r="1.5" fill="#FF3333" opacity="0.5">
    <animate attributeName="cx" values="50;850;50" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>